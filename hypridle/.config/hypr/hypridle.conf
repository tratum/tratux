general {
    # If hyprlock isn’t running, run it. This command is executed when "loginctl lock-session" is called.
    lock_cmd = pidof hyprlock || hyprlock
    # unlock_cmd = killall hyprlock  (this line is commented out; hyprlock will be stopped automatically on unlock)
    
    # Before going to sleep, ensure the session is locked.
    before_sleep_cmd = loginctl lock-session
    # After sleep, turn on DPMS (display power management signaling) to turn on the screen.
    after_sleep_cmd = hyprctl dispatch dpms on
    # Respect DBus idle-inhibit requests (for example, from media apps).
    ignore_dbus_inhibit = false
}

# Screenlock listener: after 600 seconds (10 minutes) of inactivity, lock the session.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
    # The on-resume notifier is commented out.
    # on-resume = notify-send "Welcome back to your desktop!"
}

# Optional: If you want to include a listener for turning off the screen when locked,
# you could add a block like this (currently commented out):
# listener {
#     timeout = 30
#     on-timeout = pidof hyprlock && hyprctl dispatch dpms off
#     on-resume = pidof hyprlock && hyprctl dispatch dpms on
# }

