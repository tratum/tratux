[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "{{background}}"
foreground = "{{foreground}}"

[colors.cursor]
cursor = "{{cursor}}"

[colors.normal]
black   = "{{color7}}"
red     = "{{color6}}"
green   = "{{color5}}"
yellow  = "{{color4}}"
blue    = "{{color3}}"
magenta = "{{color2}}"
cyan    = "{{color1}}"
white   = "{{color0}}"

[colors.bright]
black   = "{{color15}}"
red     = "{{color14}}"
green   = "{{color13}}"
yellow  = "{{color12}}"
blue    = "{{color11}}"
magenta = "{{color10}}"
cyan    = "{{color9}}"
white   = "{{color8}}"