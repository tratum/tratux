# ~/.config/fastfetch/config.conf

distro.enable = false

ascii_art.enable = true
ascii_art.path = ~/.config/fastfetch/akuma.txt

# Only show the "info blocks" you want:
# valid keys include: os, host, kernel, uptime, shell, packages, memory, disk, cpu, gpu, gpu_driver, etc.
info.os.enable       = true
info.host.enable     = true
info.kernel.enable   = true
info.shell.enable    = true
info.cpu.enable      = false
info.memory.enable   = false
info.gpu.enable      = false
info.battery.enable  = false
