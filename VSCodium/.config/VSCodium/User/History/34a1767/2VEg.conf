background {
    monitor =
    path = $HOME/.config/.current_wallpaper
    # color = #111111
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +'%A') </big></b>"
    color = #FFFFFF
    font_size = 112  
    font_family = Afacad Flux
    shadow_passes = 3
    shadow_size = 4
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +'%M') </big></b>"
    color = #FFFFFF
    font_size = 112
    font_family = Afacad Flux
    shadow_passes = 3
    shadow_size = 4
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:86400000] echo "<b> $(date +'%d %b %Y') </b>"
    color = #CCCCCC
    font_size = 28
    font_family = Afacad Flux
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000000] echo "<b>Feels like $(curl -s 'wttr.in?format=%t' | tr -d ' + ') </b>"
    color = #CCCCCC
    font_size = 28
    font_family = Afacad Flux
    position = 0, 40
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1

    rounding = 22
    outer_color = #000000
    inner_color = #000000
    font_color = rgb(51, 50, 50)
    fade_on_empty = true
    placeholder_text = <i> Enter Password...</i>

    position = 0, 120
    halign = center
    valign = bottom
}